name: Verify hash triggers with the container integration
on:
  push:
    branches:
      - verify/linux-hash-triggers
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the Docker engine
        run: docker version
      - name: Build and test with the real disposable node, MySQL and worker
        env:
          ATTO_TEST_INTEGRATION: '1'
        run: npm test
